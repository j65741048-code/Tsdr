          cat > 'src/main/java/com/example/railworks/RWNetwork.java' <<'EOF_NEW2'
          package com.example.railworks;

          import com.simibubi.create.AllBlocks;
          import com.simibubi.create.content.trains.bogey.AbstractBogeyBlock;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.block.state.properties.BlockStateProperties;
          import net.minecraft.world.phys.Vec3;
          import net.neoforged.neoforge.network.event.RegisterPayloadHandlersEvent;
          import net.neoforged.neoforge.network.handling.IPayloadContext;
          import net.neoforged.neoforge.network.registration.PayloadRegistrar;

          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.List;

          public class RWNetwork {
              public static void register(RegisterPayloadHandlersEvent event) {
                  PayloadRegistrar registrar = event.registrar("1");
                  registrar.playToServer(SwitchBogeyPayload.TYPE, SwitchBogeyPayload.CODEC, RWNetwork::handleSwitch);
              }

              /**
               * Switches the bogey the player is looking at to the next bogey type of the same size.
               * Works with every bogey block registered by any mod (Create, Railworks, Steam 'n' Rails,
               * Blocks 'n Bogies, ...), so with only Create + Railworks it simply toggles Normal <-> Brass. Only bogeys of the same gauge are offered.
               */
              private static void handleSwitch(SwitchBogeyPayload payload, IPayloadContext ctx) {
                  ctx.enqueueWork(() -> {
                      if (!(ctx.player() instanceof ServerPlayer player)) return;
                      Level level = player.level();
                      BlockPos pos = payload.pos();

                      if (!player.getMainHandItem().is(AllBlocks.RAILWAY_CASING.asItem())) return;
                      if (player.distanceToSqr(Vec3.atCenterOf(pos)) > 64.0) return;
                      if (!level.hasChunkAt(pos)) return;
                      if (!level.mayInteract(player, pos)) return;

                      BlockState state = level.getBlockState(pos);
                      if (!(state.getBlock() instanceof AbstractBogeyBlock<?> current)) {
                          player.displayClientMessage(Component.translatable("railworks.switch.not_bogey"), true);
                          return;
                      }

                      List<AbstractBogeyBlock<?>> options = new ArrayList<>();
                      for (Block block : BuiltInRegistries.BLOCK) {
                          if (block instanceof AbstractBogeyBlock<?> other && other.getSize() == current.getSize()
                                  && sameGauge(current, other)) {
                              options.add(other);
                          }
                      }
                      options.sort(Comparator.comparing(
                              (AbstractBogeyBlock<?> b) -> BuiltInRegistries.BLOCK.getKey(b).toString()));

                      if (options.size() < 2) {
                          player.displayClientMessage(Component.translatable("railworks.switch.only_one"), true);
                          return;
                      }

                      AbstractBogeyBlock<?> target = options.get((options.indexOf(current) + 1) % options.size());
                      BlockState next = target.defaultBlockState();
                      if (state.hasProperty(BlockStateProperties.HORIZONTAL_AXIS)
                              && next.hasProperty(BlockStateProperties.HORIZONTAL_AXIS)) {
                          next = next.setValue(BlockStateProperties.HORIZONTAL_AXIS,
                                  state.getValue(BlockStateProperties.HORIZONTAL_AXIS));
                      }
                      if (state.hasProperty(BlockStateProperties.WATERLOGGED)
                              && next.hasProperty(BlockStateProperties.WATERLOGGED)) {
                          next = next.setValue(BlockStateProperties.WATERLOGGED,
                                  state.getValue(BlockStateProperties.WATERLOGGED));
                      }

                      level.setBlockAndUpdate(pos, next);
                      level.playSound(null, pos, SoundEvents.NETHERITE_BLOCK_PLACE, SoundSource.BLOCKS, 1.0F, 1.0F);
                      player.displayClientMessage(Component.translatable("railworks.switch.done", target.getName()), true);
                  });
              }

              /** Only offer bogeys of the same gauge, otherwise the train would sit on track it cannot ride. */
              private static boolean sameGauge(AbstractBogeyBlock<?> a, AbstractBogeyBlock<?> b) {
                  try {
                      return a.getTrackType(a.getDefaultStyle()).equals(b.getTrackType(b.getDefaultStyle()));
                  } catch (RuntimeException e) {
                      return true;
                  }
              }
          }
          EOF_NEW2
