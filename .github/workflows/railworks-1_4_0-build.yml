          package com.example.railworks;

          import com.simibubi.create.AllBlocks;
          import com.simibubi.create.content.trains.track.TrackBlockItem;
          import com.simibubi.create.foundation.data.CreateRegistrate;

          import net.minecraft.core.registries.Registries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.item.CreativeModeTab;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.neoforged.bus.api.IEventBus;
          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.fml.common.Mod;
          import net.neoforged.fml.loading.FMLEnvironment;
          import net.neoforged.neoforge.registries.DeferredItem;
          import net.neoforged.neoforge.registries.DeferredRegister;

          import java.util.function.Supplier;

          @Mod(Railworks.MODID)
          public class Railworks {
              public static final String MODID = "railworks";
              public static final CreateRegistrate REGISTRATE = CreateRegistrate.create(MODID);

              public static final DeferredRegister<CreativeModeTab> TABS =
                      DeferredRegister.create(Registries.CREATIVE_MODE_TAB, MODID);
              public static final DeferredRegister.Items ITEMS = DeferredRegister.createItems(MODID);

              /**
               * The Brass Track item is registered here, not through Registrate. Registrate adds every item it
               * registers to a creative tab by itself, which clashed with the tab below and crashed the game when
               * the inventory opened. Now the tab below is the only thing that puts items into it.
               */
              public static final DeferredItem<Item> BRASS_TRACK_ITEM = ITEMS.register("brass_track",
                      () -> new TrackBlockItem(RWBlocks.BRASS_TRACK.get(), new Item.Properties()));

              public static final DeferredItem<Item> BRASS_MINECART_TRACK_ITEM = ITEMS.register("brass_minecart_track",
                      () -> new TrackBlockItem(RWBlocks.BRASS_MINECART_TRACK.get(), new Item.Properties()));

              public static final Supplier<CreativeModeTab> MAIN_TAB = TABS.register("main", () ->
                      CreativeModeTab.builder()
                              .title(Component.translatable("itemGroup.railworks"))
                              .icon(() -> new ItemStack(BRASS_TRACK_ITEM.get()))
                              .displayItems((params, out) -> {
                                  out.accept(BRASS_TRACK_ITEM.get());
                                  out.accept(BRASS_MINECART_TRACK_ITEM.get());
                                  // The Brass Bogey has no item of its own; it is made from / drops the Railway Casing
                                  out.accept(AllBlocks.RAILWAY_CASING.get());
                              })
                              .build());

              public static ResourceLocation id(String path) {
                  return ResourceLocation.fromNamespaceAndPath(MODID, path);
              }

              public Railworks(IEventBus modBus) {
                  REGISTRATE.registerEventListeners(modBus);
                  ITEMS.register(modBus);
                  TABS.register(modBus);
                  modBus.addListener(RWNetwork::register);
                  if (FMLEnvironment.dist == Dist.CLIENT) {
                      RWClient.init(modBus);
                  }
                  // Order matters: track material -> blocks -> block entities -> bogey style
                  RWTracks.init();
                  RWBlocks.init();
                  RWBlockEntities.init();
                  RWBogeys.init();
              }
          }
