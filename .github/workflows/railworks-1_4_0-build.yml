name: Build Railworks

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generate project files (Gradle settings, Brass tracks and bogeys, Ponder scenes, textures, icon)
        run: |
          mkdir -p "$(dirname 'src/main/resources/assets/railworks/models/block/track/brass/obj_track.json')"
          cat > 'src/main/resources/assets/railworks/models/block/track/brass/obj_track.json' <<'EOF_1'
          {"ambientocclusion":false,"textures":{"0":"railworks:block/brass_track","1":"railworks:block/brass_track_mip","2":"railworks:block/brass_track_crossing","particle":"create:block/palettes/stone_types/polished/andesite_cut_polished"}}
