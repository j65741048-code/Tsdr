          cat > 'src/main/java/com/example/railworks/RWClient.java' <<'EOF_NEW3'
          package com.example.railworks;

          import com.mojang.blaze3d.platform.InputConstants;
          import com.simibubi.create.AllBlocks;

          import net.createmod.ponder.foundation.PonderIndex;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.Minecraft;
          import net.minecraft.world.phys.BlockHitResult;
          import net.minecraft.world.phys.HitResult;
          import net.neoforged.bus.api.IEventBus;
          import net.neoforged.fml.event.lifecycle.FMLClientSetupEvent;
          import net.neoforged.neoforge.client.event.ClientTickEvent;
          import net.neoforged.neoforge.client.event.RegisterKeyMappingsEvent;
          import net.neoforged.neoforge.common.NeoForge;
          import net.neoforged.neoforge.network.PacketDistributor;

          /** Client only: the "switch bogey" key (Left Alt by default, can be changed in Controls) and Ponder. */
          public class RWClient {
              public static final KeyMapping SWITCH_BOGEY = new KeyMapping("key.railworks.switch_bogey",
                      InputConstants.Type.KEYSYM, InputConstants.KEY_LALT, "key.categories.railworks");

              public static void init(IEventBus modBus) {
                  modBus.addListener(RWClient::registerKeys);
                  modBus.addListener(RWClient::onClientSetup);
                  NeoForge.EVENT_BUS.addListener(RWClient::onClientTick);
              }

              private static void registerKeys(RegisterKeyMappingsEvent event) {
                  event.register(SWITCH_BOGEY);
              }

              private static void onClientSetup(FMLClientSetupEvent event) {
                  event.enqueueWork(() -> PonderIndex.addPlugin(new RWPonderPlugin()));
              }

              private static void onClientTick(ClientTickEvent.Post event) {
                  Minecraft mc = Minecraft.getInstance();
                  boolean usable = mc.player != null && mc.level != null && mc.screen == null;
                  while (SWITCH_BOGEY.consumeClick()) {
                      if (!usable) continue;
                      if (!mc.player.getMainHandItem().is(AllBlocks.RAILWAY_CASING.asItem())) continue;
                      if (mc.hitResult instanceof BlockHitResult hit && hit.getType() == HitResult.Type.BLOCK) {
                          PacketDistributor.sendToServer(new SwitchBogeyPayload(hit.getBlockPos()));
                      }
                  }
              }
          }
          EOF_NEW3
