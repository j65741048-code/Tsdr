          package com.example.railworks;

          import com.mojang.logging.LogUtils;

          import net.createmod.ponder.api.registration.PonderPlugin;
          import net.createmod.ponder.api.registration.PonderSceneRegistrationHelper;
          import net.minecraft.resources.ResourceLocation;

          import org.slf4j.Logger;

          /** Registers the Railworks Ponder scenes (hold W over the item in the inventory to see them). */
          public class RWPonderPlugin implements PonderPlugin {
              private static final Logger LOGGER = LogUtils.getLogger();
              private static final ResourceLocation RAILWAY_CASING =
                      ResourceLocation.fromNamespaceAndPath("create", "railway_casing");

              @Override
              public String getModId() {
                  return Railworks.MODID;
              }

              @Override
              public void registerScenes(PonderSceneRegistrationHelper<ResourceLocation> helper) {
                  LOGGER.info("Railworks: registering Ponder scenes (brass track, minecart gauge track, railway casing)");

                  helper.forComponents(RWBlocks.BRASS_TRACK.getId())
                          .addStoryBoard("brass_track", RWPonderScenes::brassTrack);

                  helper.forComponents(RWBlocks.BRASS_MINECART_TRACK.getId())
                          .addStoryBoard("minecart_gauge", RWPonderScenes::minecartGauge);

                  // The Railway Casing (train casing) gets both scenes: what it does, and how to change to the Brass Bogey.
                  helper.forComponents(RAILWAY_CASING)
                          .addStoryBoard("railway_casing", RWPonderScenes::railwayCasing)
                          .addStoryBoard("bogey_switch", RWPonderScenes::bogeySwitch);
              }
          }
          EOF_N103
          mkdir -p "$(dirname 'src/main/java/com/example/railworks/RWPonderScenes.java')"
          cat > 'src/main/java/com/example/railworks/RWPonderScenes.java' <<'EOF_N104'
          package com.example.railworks;

          import net.createmod.ponder.api.scene.SceneBuilder;
          import net.createmod.ponder.api.scene.SceneBuildingUtil;
          import net.minecraft.core.Direction;
          import net.minecraft.world.level.block.state.properties.BlockStateProperties;

          /**
           * Scene layouts (schematics live in assets/railworks/ponder/):
           * floor at y=0, track along z at y=1, bogey blocks at y=2 (a bogey block sits on top of its track).
           */
          public class RWPonderScenes {

              public static void brassTrack(SceneBuilder scene, SceneBuildingUtil util) {
                  scene.title("brass_track", "Brass Train Track");
                  scene.configureBasePlate(0, 0, 5);
                  scene.world().showSection(util.select().layer(0), Direction.UP);
                  scene.idle(10);

                  // schematic: Create track on z 0-1, Brass track on z 2-4, Brass bogey on top at z 2
                  scene.world().showSection(util.select().fromTo(2, 1, 2, 2, 1, 4), Direction.DOWN);
                  scene.idle(10);
                  scene.overlay().showText(70)
                          .text("Brass Train Track is laid down just like any other Create track")
                          .pointAt(util.vector().topOf(2, 1, 3))
                          .placeNearTarget();
                  scene.idle(80);

                  scene.world().showSection(util.select().position(2, 2, 2), Direction.DOWN);
                  scene.idle(10);
                  scene.overlay().showText(70)
                          .text("Brass Bogeys ride on it...")
                          .attachKeyFrame()
                          .pointAt(util.vector().topOf(2, 2, 2))
                          .placeNearTarget();
                  scene.idle(80);

                  scene.world().showSection(util.select().fromTo(2, 1, 0, 2, 1, 1), Direction.DOWN);
                  scene.idle(10);
                  scene.overlay().showText(90)
                          .text("...and on regular Create tracks too, so mixing track types no longer derails the train")
                          .attachKeyFrame()
                          .pointAt(util.vector().topOf(2, 1, 0))
                          .placeNearTarget();
                  scene.idle(100);
              }

              public static void minecartGauge(SceneBuilder scene, SceneBuildingUtil util) {
                  scene.title("minecart_gauge", "Brass Minecart Gauge Track");
                  scene.configureBasePlate(0, 0, 5);
                  scene.world().showSection(util.select().layer(0), Direction.UP);
                  scene.idle(10);

                  // schematic: Brass track at x=1, Minecart gauge track at x=3, bogeys on top at z=2
                  scene.world().showSection(util.select().fromTo(1, 1, 0, 1, 1, 4), Direction.DOWN);
                  scene.world().showSection(util.select().fromTo(3, 1, 0, 3, 1, 4), Direction.DOWN);
                  scene.idle(10);
                  scene.overlay().showText(80)
                          .text("The Minecart Gauge track is the narrow Steam 'n' Rails gauge, in Brass style (right)")
                          .pointAt(util.vector().topOf(3, 1, 3))
                          .placeNearTarget();
                  scene.idle(90);

                  scene.world().showSection(util.select().position(1, 2, 2), Direction.DOWN);
                  scene.world().showSection(util.select().position(3, 2, 2), Direction.DOWN);
                  scene.idle(10);
                  scene.overlay().showText(80)
                          .text("The Brass Minecart Bogey is the matching narrow bogey")
                          .attachKeyFrame()
                          .pointAt(util.vector().topOf(3, 2, 2))
                          .placeNearTarget();
                  scene.idle(90);

                  scene.overlay().showText(90)
                          .text("Only narrow gauge bogeys can ride it. A Brass Track can be crafted into a Minecart Gauge Track and back")
                          .attachKeyFrame()
                          .pointAt(util.vector().topOf(2, 1, 0))
                          .placeNearTarget();
                  scene.idle(100);
              }

              public static void bogeySwitch(SceneBuilder scene, SceneBuildingUtil util) {
                  scene.title("bogey_switch", "Switching Bogey Types");
                  scene.configureBasePlate(0, 0, 5);
                  scene.world().showSection(util.select().layer(0), Direction.UP);
                  scene.idle(5);
                  scene.world().showSection(util.select().fromTo(2, 1, 0, 2, 1, 4), Direction.DOWN);
                  scene.idle(5);
                  scene.world().showSection(util.select().position(2, 2, 2), Direction.DOWN);
                  scene.idle(10);

                  scene.overlay().showText(70)
                          .text("Hold a Railway Casing and look at a bogey")
                          .pointAt(util.vector().topOf(2, 2, 2))
                          .placeNearTarget();
                  scene.idle(80);

                  scene.overlay().showText(80)
                          .text("Press Left Alt to switch it to the next bogey type of the same size and gauge")
                          .attachKeyFrame()
                          .pointAt(util.vector().topOf(2, 2, 2))
                          .placeNearTarget();
                  scene.idle(30);
                  scene.world().replaceBlocks(util.select().position(2, 2, 2),
                          RWBlocks.BRASS_BOGEY.getDefaultState()
                                  .setValue(BlockStateProperties.HORIZONTAL_AXIS, Direction.Axis.Z),
                          true);
                  scene.idle(60);

                  scene.overlay().showText(90)
                          .text("Bogeys from other Create addons are included. The key can be rebound in the Controls menu")
                          .pointAt(util.vector().topOf(2, 2, 2))
                          .placeNearTarget();
                  scene.idle(100);
              }

              public static void railwayCasing(SceneBuilder scene, SceneBuildingUtil util) {
                  scene.title("railway_casing", "Railway Casing");
                  scene.configureBasePlate(0, 0, 5);
                  scene.world().showSection(util.select().layer(0), Direction.UP);
                  scene.idle(5);
                  scene.world().showSection(util.select().fromTo(2, 1, 0, 2, 1, 4), Direction.DOWN);
                  scene.idle(5);
                  scene.world().showSection(util.select().position(2, 2, 2), Direction.DOWN);
                  scene.idle(10);

                  scene.overlay().showText(80)
                          .text("The Railway Casing is the key item for Railworks bogeys. Brass Bogeys have no item of their own and drop a Railway Casing when broken")
                          .pointAt(util.vector().topOf(2, 2, 2))
                          .placeNearTarget();
                  scene.idle(90);

                  scene.overlay().showText(80)
                          .text("Hold it while looking at a bogey to change the bogey type. The next scene shows how")
                          .attachKeyFrame()
                          .pointAt(util.vector().topOf(2, 2, 2))
                          .placeNearTarget();
                  scene.idle(90);
              }
          }
          EOF_N104
