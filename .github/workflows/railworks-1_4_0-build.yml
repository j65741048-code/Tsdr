          package com.example.railworks;

          import com.simibubi.create.AllBlocks;
          import com.simibubi.create.content.trains.bogey.AbstractBogeyBlock;
          import com.simibubi.create.content.trains.bogey.BogeySizes;
          import com.simibubi.create.content.trains.bogey.BogeyStyle;
          import com.simibubi.create.content.trains.track.TrackMaterial;

          import net.minecraft.core.BlockPos;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.level.LevelReader;
          import net.minecraft.world.level.block.entity.BlockEntityType;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.HitResult;
          import net.minecraft.world.phys.Vec3;

          /** The narrow "minecart gauge" brass bogey. Runs on the Steam 'n' Rails narrow gauge, like the Minecart Gauge track. */
          public class MinecartBogeyBlock extends AbstractBogeyBlock<MinecartBogeyBlockEntity> {
              public MinecartBogeyBlock(Properties properties) {
                  super(properties, BogeySizes.SMALL);
              }

              @Override
              public TrackMaterial.TrackType getTrackType(BogeyStyle style) {
                  return RWGauges.narrow();
              }

              @Override
              public double getWheelPointSpacing() {
                  return 2;
              }

              @Override
              public double getWheelRadius() {
                  return 6.5 / 16d;
              }

              @Override
              public Vec3 getConnectorAnchorOffset() {
                  return new Vec3(0, 7 / 32f, 1);
              }

              @Override
              public BogeyStyle getDefaultStyle() {
                  return RWBogeys.BRASS_MINECART;
              }

              @Override
              public ItemStack getCloneItemStack(BlockState state, HitResult target, LevelReader level, BlockPos pos,
                                                 Player player) {
                  return AllBlocks.RAILWAY_CASING.asStack();
              }

              @Override
              public Class<MinecartBogeyBlockEntity> getBlockEntityClass() {
                  return MinecartBogeyBlockEntity.class;
              }

              @Override
              public BlockEntityType<? extends MinecartBogeyBlockEntity> getBlockEntityType() {
                  return RWBlockEntities.MINECART_BOGEY.get();
              }
          }
          EOF_N101
