          package com.example.railworks;

          import com.mojang.logging.LogUtils;
          import com.simibubi.create.content.trains.track.TrackMaterial;

          import net.minecraft.resources.ResourceLocation;

          import org.slf4j.Logger;

          import java.lang.reflect.Field;
          import java.util.Collection;
          import java.util.List;
          import java.util.Map;

          /**
           * Finds the Steam 'n' Rails (NeoForge port, mod id "railways") narrow gauge track type, so the Minecart Gauge
           * track and bogey share the gauge of Steam 'n' Rails narrow trains. It is looked up through Create's own
           * track material list, so Railworks needs no compile time dependency on Steam 'n' Rails. The lookup runs once;
           * if Steam 'n' Rails or its narrow gauge is not found the Minecart Gauge falls back to the STANDARD gauge and a
           * warning is written to the log, so the game never crashes because of it.
           */
          public final class RWGauges {
              private static final Logger LOGGER = LogUtils.getLogger();
              private static TrackMaterial.TrackType narrow;

              private RWGauges() {
              }

              public static synchronized TrackMaterial.TrackType narrow() {
                  if (narrow == null) {
                      TrackMaterial.TrackType found = find();
                      if (found != null) {
                          LOGGER.info("Railworks: Minecart Gauge is using the Steam 'n' Rails narrow gauge");
                          narrow = found;
                      } else {
                          LOGGER.warn("Railworks: Steam 'n' Rails narrow gauge was not found, "
                                  + "the Minecart Gauge falls back to the standard gauge");
                          narrow = TrackMaterial.TrackType.STANDARD;
                      }
                  }
                  return narrow;
              }

              private static TrackMaterial.TrackType find() {
                  try {
                      Object all = TrackMaterial.class.getField("ALL").get(null);
                      Collection<?> materials = all instanceof Map<?, ?> map ? map.values()
                              : all instanceof Collection<?> c ? c : List.of();
                      for (Object material : materials) {
                          Object id = read(material, "id");
                          if (!(id instanceof ResourceLocation rl)) continue;
                          if (!"railways".equals(rl.getNamespace()) || !rl.getPath().contains("narrow")) continue;
                          if (read(material, "trackType") instanceof TrackMaterial.TrackType type) {
                              return type;
                          }
                      }
                  } catch (ReflectiveOperationException | RuntimeException e) {
                      LOGGER.warn("Railworks: could not look up Steam 'n' Rails track materials", e);
                  }
                  return null;
              }

              private static Object read(Object target, String name) throws ReflectiveOperationException {
                  Field field;
                  try {
                      field = target.getClass().getField(name);
                  } catch (NoSuchFieldException e) {
                      field = target.getClass().getDeclaredField(name);
                      field.setAccessible(true);
                  }
                  return field.get(target);
              }
          }
          EOF_N150

      - name: Build jar
        run: gradle build --no-daemon

      - name: Show jar
        run: ls -la build/libs

      - name: Upload jar (download button, no zip)
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/railworks-1.4.0.jar
          archive: false
          if-no-files-found: error

      - name: Publish jar to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
