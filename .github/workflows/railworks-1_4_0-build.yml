          mkdir -p "$(dirname 'src/main/resources/assets/railworks/models/block/track/brass/tie.json')"
          cat > 'src/main/resources/assets/railworks/models/block/track/brass/tie.json' <<'EOF_2'
          {"parent":"railworks:block/track/brass/obj_track","loader":"neoforge:obj","flip_v":true,"model":"create:models/block/track/tie.obj","render_type":"minecraft:cutout_mipped"}
